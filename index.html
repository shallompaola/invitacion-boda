<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a Nuestra Boda</title>
    <style>
        :root {
            --primary-color: #581845;
            --accent-color: #900C3F;
            --bg-color: #fcf8f7;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --gray-light: #f0f0f0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 600px;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .subtitle {
            font-style: italic;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .question-box {
            display: none;
        }

        .question-box.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            color: var(--text-color);
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background-color: #fff9fa;
            transform: translateY(-2px);
        }

        /* Pantalla de inicio con botones dinámicos */
        .initial-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .btn-container {
            position: relative;
            width: 240px;
            height: 60px;
            margin-top: 30px;
        }

        .btn-yes, .btn-no {
            position: absolute;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.15s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: none;
        }

        .btn-yes {
            background-color: var(--accent-color);
            color: white;
            left: 10px;
            top: 0;
            z-index: 1;
        }

        .btn-no {
            background-color: #e0e0e0;
            color: #333;
            /* Se solapa parcialmente al botón de Sí (dejando ver un trocito del Sí) */
            left: 90px;
            top: 0;
            z-index: 2;
        }

        /* Pantalla intermedia si dicen que No */
        .no-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .no-screen p {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: 500;
        }

        .whatsapp-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .retry-btn {
            background-color: #666;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .footer-note {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        .result-screen {
            display: none;
        }

        .link-canva-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s;
        }

        .link-canva-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        
        <!-- Pantalla de Bienvenida -->
        <div id="screen-welcome" class="initial-screen">
            <h1>¿Quieres venir a mi boda? 💍</h1>
            <p class="subtitle">Una decisión importante requiere una pequeña prueba...</p>
            <div class="btn-container">
                <button class="btn-yes" onclick="startQuiz()">SÍ</button>
                <button class="btn-no" id="btnNo" onmouseover="moveButton()" onclick="showNoScreen()">NO</button>
            </div>
        </div>

        <!-- Pantalla Intermedia si hace clic en NO -->
        <div id="screen-no-choice" class="no-screen">
            <h1>¡Qué lamentable! 🥺</h1>
            <p>¿No puedes ir a la boda? Notifícanos de inmediato por Whatsapp.</p>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
                <button class="retry-btn" onclick="resetToWelcome()">Sí puedo y quiero</button>
                <a href="https://wa.me/" target="_blank" class="whatsapp-btn">WhatsApp</a>
            </div>
        </div>

        <!-- Contenedor del Cuestionario -->
        <div id="quiz-container" style="display: none;">
            <div id="question-box" class="question-box">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>

        <!-- Pantalla de Resultados -->
        <div id="screen-result" class="result-screen">
            <h1 id="result-title"></h1>
            <p class="subtitle" id="result-subtitle"></p>
            <div id="result-actions"></div>
        </div>

        <div class="footer-note">CON AMOR Y EXPECTATIVAS SOSPECHOSAMENTE ALTAS</div>
    </div>

    <script>
        const questions = [
            {
                title: "¿Qué tanto te emociona mi boda? 💌",
                options: [
                    { text: "¡No me la pierdo por nada del mundo! 🎉", correct: true },
                    { text: "¡Ya tengo listo el outfit! 🕺🏻", correct: true },
                    { text: "Voy principalmente por la comida 🍰🍪🥂", correct: true },
                    { text: "Voy por compromiso 🙃", correct: false },
                    { text: "Se me olvidó que te ibas a casar 🫣", correct: false }
                ]
            },
            {
                title: "¿Vas a llorar durante la ceremonia?",
                options: [
                    { text: "Obviamente 💁🏻‍♀️", correct: true },
                    { text: "Voy a llorar a mares 😭", correct: true },
                    { text: "Intentaré contener las lágrimas 🥹", correct: true },
                    { text: "Solo si los demás lloran", correct: true },
                    { text: "No ❤️", correct: false }
                ]
            },
            {
                title: "¿Qué vas a traer como regalo de boda?",
                options: [
                    { text: "Dinero, obviamente 💵", correct: true },
                    { text: "Algo de la lista de regalos 🎁", correct: true },
                    { text: "Algo lindo que encontré 🫖", correct: true },
                    { text: "Compraré algo a última hora de camino 💨", correct: true },
                    { text: "Mi presencia es el regalo. 😜", correct: false }
                ]
            },
            {
                title: "¿De qué color será el vestido que usarás en mi boda?",
                options: [
                    { text: "Blanco", correct: false },
                    { text: "Negro", correct: true },
                    { text: "Rojo", correct: true },
                    { text: "Otro", correct: true },
                    { text: "Del color que tú me digas 😌", correct: true },
                    { text: "Soy hombre 😐", correct: true }
                ]
            },
            {
                title: "Si por casualidad de la vida a la hora de servir tu quedas de último ¿Cómo reaccionarías?",
                options: [
                    { text: "Normal, son cosas que pasan", correct: true },
                    { text: "Voy directo hacia la comida ¡No me puedo quedar sin nada!", correct: true },
                    { text: "¡Seguramente a los novios o a alguien le caigo mal y lo orquestó en mi contra!", correct: false },
                    { text: "Estoy más pendiente de otras cosas", correct: true }
                ]
            },
            {
                title: "¿Planeas ayudar a los novios o ya los ayudaste durante la organización?",
                options: [
                    { text: "No, que se las arreglen solos", correct: false },
                    { text: "Los ayudaré con el aseo", correct: true },
                    { text: "Les llevaré un regalito y eso es suficiente", correct: true },
                    { text: "Los ayudo con los pasapalos", correct: true },
                    { text: "Les daré muy buenos consejos", correct: true }
                ]
            },
            {
                title: "Si los novios después de su boda, en su vida matrimonial tienen algunos problemas ¿tu qué les dirías?",
                options: [
                    { text: "¡Bótal@! ¡Los hombres/mujeres no sirven!", correct: false },
                    { text: "¡Yo te dije que no te casaras!", correct: false },
                    { text: "¡Aguanta! ¡Aguanta! ¡Aguanta!", correct: true },
                    { text: "Perdónal@, (ella te hace la comida)/(el te paga las uñas)", correct: true },
                    { text: "Ámal@ como Cristo lo amó", correct: true }
                ]
            },
            {
                title: "¿Cuál es el nombre de la novia?",
                options: [
                    { text: "Sharon", correct: true },
                    { text: "Charo", correct: false },
                    { text: "Shallom", correct: true },
                    { text: "Paulina", correct: false }
                ]
            },
            {
                title: "¿Cuál es el nombre del novio?",
                options: [
                    { text: "Cristhian", correct: true },
                    { text: "Cristh", correct: false },
                    { text: "Kristhian", correct: true },
                    { text: "Kristhopher", correct: false }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let incorrectAnswersCount = 0;

        function moveButton() {
            const btnNo = document.getElementById('btnNo');
            // Al pasar el mouse se mueve ligeramente cerca del sí para dificultarlo un poco más
            const randomX = (Math.random() - 0.5) * 80;
            const randomY = (Math.random() - 0.5) * 40;
            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function showNoScreen() {
            document.getElementById('screen-welcome').style.display = 'none';
            document.getElementById('screen-no-choice').style.display = 'flex';
        }

        function resetToWelcome() {
            document.getElementById('screen-no-choice').style.display = 'none';
            document.getElementById('screen-welcome').style.display = 'flex';
            const btnNo = document.getElementById('btnNo');
            btnNo.style.transform = 'translate(0px, 0px)';
        }

        function startQuiz() {
            document.getElementById('screen-welcome').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            currentQuestionIndex = 0;
            incorrectAnswersCount = 0;
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestionIndex];
            const box = document.getElementById('question-box');
            
            let html = `<h2>${q.title}</h2><div class="options-grid">`;
            q.options.forEach((opt, index) => {
                html += `<button class="option-btn" onclick="selectOption(${opt.correct})">${opt.text}</button>`;
            });
            html += `</div>`;
            
            box.innerHTML = html;
            box.classList.add('active');
        }

        function selectOption(isCorrect) {
            if (!isCorrect) {
                incorrectAnswersCount++;
            }

            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-container').style.display = 'none';
            const resultScreen = document.getElementById('screen-result');
            const title = document.getElementById('result-title');
            const subtitle = document.getElementById('result-subtitle');
            const actions = document.getElementById('result-actions');

            resultScreen.style.display = 'block';

            // Si tiene 2 o más incorrectas, está rechazado/reprobado
            if (incorrectAnswersCount >= 2) {
                title.innerHTML = "¡REPROBASTE! 💔";
                subtitle.innerHTML = "Lamentablemente no cumples con el porcentaje requerido de expectativas.";
                actions.innerHTML = `<button class="retry-btn" onclick="startQuiz()" style="margin-top:20px; padding:12px 25px;">Intentar de nuevo</button>`;
            } else {
                title.innerHTML = "¡APROBASTE! 🎉";
                subtitle.innerHTML = "¡Tienes una invitación! Sabía que podía confiar en ti.";
                // AQUÍ ESTÁ TU LINK DE CANVA INTEGRADO
                actions.innerHTML = `<a href="https://walrus-2gnrvm.my.canva.site/" target="_blank" class="link-canva-btn">Aquí el link de la invitación</a>`;
            }
        }
    </script>
</body>
</html>
